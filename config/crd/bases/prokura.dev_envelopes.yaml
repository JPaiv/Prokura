---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: envelopes.prokura.dev
spec:
  group: prokura.dev
  names:
    kind: Envelope
    listKind: EnvelopeList
    plural: envelopes
    singular: envelope
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.identity
      name: Identity
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Envelope is a cluster-scoped definition of a kind of work. It declares
          who may request it, what it may touch, and how its mandates are bounded.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvelopeSpec defines a kind of work a run may be authorized
              for.
            properties:
              approval:
                description: Approval controls whether mandates need approval.
                properties:
                  required:
                    description: Required makes every mandate start in phase Pending
                      until approved.
                    type: boolean
                type: object
              description:
                description: Description of the work, for humans reviewing the envelope.
                type: string
              mandate:
                description: Mandate bounds the mandates issued for this envelope.
                properties:
                  maxCalls:
                    description: |-
                      MaxCalls is the maximum number of API calls one run may make.
                      Zero means unlimited.
                    format: int32
                    minimum: 0
                    type: integer
                  ttl:
                    description: TTL is how long a mandate is valid after issuance.
                    type: string
                required:
                - ttl
                type: object
              principals:
                description: Principals allowed to request a mandate for this envelope.
                items:
                  description: |-
                    EnvelopePrincipal identifies a principal allowed to request a mandate for
                    an envelope. Exactly the fields for the given kind must be set.
                  properties:
                    claims:
                      additionalProperties:
                        type: string
                      description: |-
                        Claims that must match, claim name to required value.
                        Only for kind OIDC.
                      type: object
                    issuer:
                      description: Issuer URL of the OIDC provider. Only for kind
                        OIDC.
                      type: string
                    kind:
                      description: Kind of credential the principal presents.
                      enum:
                      - ServiceAccount
                      - OIDC
                      - SPIFFE
                      type: string
                    name:
                      description: Name of the ServiceAccount. Only for kind ServiceAccount.
                      type: string
                    namespace:
                      description: Namespace of the ServiceAccount. Only for kind
                        ServiceAccount.
                      type: string
                    spiffeID:
                      description: |-
                        SPIFFEID is the SPIFFE ID the workload must present. A trailing
                        "/*" matches any path below the prefix. Only for kind SPIFFE.
                      type: string
                  required:
                  - kind
                  type: object
                minItems: 1
                type: array
              scope:
                description: Scope is what a run may access.
                properties:
                  namespaces:
                    description: Namespaces a run may act in.
                    properties:
                      names:
                        description: Names lists namespaces explicitly.
                        items:
                          type: string
                        type: array
                      selector:
                        description: Selector matches namespaces by label.
                        properties:
                          matchExpressions:
                            description: matchExpressions is a list of label selector
                              requirements. The requirements are ANDed.
                            items:
                              description: |-
                                A label selector requirement is a selector that contains values, a key, and an operator that
                                relates the key and values.
                              properties:
                                key:
                                  description: key is the label key that the selector
                                    applies to.
                                  type: string
                                operator:
                                  description: |-
                                    operator represents a key's relationship to a set of values.
                                    Valid operators are In, NotIn, Exists and DoesNotExist.
                                  type: string
                                values:
                                  description: |-
                                    values is an array of string values. If the operator is In or NotIn,
                                    the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                    the values array must be empty. This array is replaced during a strategic
                                    merge patch.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: |-
                              matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                              map is equivalent to an element of matchExpressions, whose key field is "key", the
                              operator is "In", and the values array contains only "value". The requirements are ANDed.
                            type: object
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  rules:
                    description: |-
                      Rules are the RBAC rules granted to the envelope identity in the
                      scoped namespaces. The validating webhook rejects rules that would
                      let a run escape its envelope (secrets, exec, impersonation, ...).
                    items:
                      description: |-
                        PolicyRule holds information that describes a policy rule, but does not contain information
                        about who the rule applies to or which namespace the rule applies to.
                      properties:
                        apiGroups:
                          description: |-
                            APIGroups is the name of the APIGroup that contains the resources.  If multiple API groups are specified, any action requested against one of
                            the enumerated resources in any API group will be allowed. "" represents the core API group and "*" represents all API groups.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        nonResourceURLs:
                          description: |-
                            NonResourceURLs is a set of partial urls that a user should have access to.  *s are allowed, but only as the full, final step in the path
                            Since non-resource URLs are not namespaced, this field is only applicable for ClusterRoles referenced from a ClusterRoleBinding.
                            Rules can either apply to API resources (such as "pods" or "secrets") or non-resource URL paths (such as "/api"),  but not both.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        resourceNames:
                          description: ResourceNames is an optional white list of
                            names that the rule applies to.  An empty set means that
                            everything is allowed.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        resources:
                          description: Resources is a list of resources this rule
                            applies to. '*' represents all resources.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        verbs:
                          description: Verbs is a list of Verbs that apply to ALL
                            the ResourceKinds contained in this rule. '*' represents
                            all verbs.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - verbs
                      type: object
                    minItems: 1
                    type: array
                required:
                - namespaces
                - rules
                type: object
              tier:
                description: Tier is the risk classification of the work.
                enum:
                - read
                - reversible
                - irreversible
                type: string
            required:
            - mandate
            - principals
            - scope
            - tier
            type: object
          status:
            description: EnvelopeStatus is the observed state of an Envelope.
            properties:
              conditions:
                description: |-
                  Conditions describe the state of the envelope's RBAC. The "Ready"
                  condition is true when the ClusterRole and bindings for the
                  identity exist and match the spec.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              identity:
                description: |-
                  Identity is the impersonated Kubernetes user name for runs of this
                  envelope: "prokura:envelope:<name>".
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the controller last
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
