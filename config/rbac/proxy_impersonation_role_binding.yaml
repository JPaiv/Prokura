# Grants the proxy its impersonation rights. The ClusterRole is not part of
# this kustomization: the controller writes it, and keeps it narrowed to the
# envelope identities that exist. Until the controller has run, the binding
# refers to a role that does not exist, and grants nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: prokura
    app.kubernetes.io/managed-by: kustomize
  name: proxy-impersonation-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prokura:proxy-impersonation
subjects:
- kind: ServiceAccount
  name: proxy
  namespace: system
