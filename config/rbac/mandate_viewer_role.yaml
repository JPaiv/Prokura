# permissions for end users to view mandates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: prokura
    app.kubernetes.io/managed-by: kustomize
  name: mandate-viewer-role
rules:
- apiGroups:
  - prokura.dev
  resources:
  - mandates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - prokura.dev
  resources:
  - mandates/status
  verbs:
  - get
